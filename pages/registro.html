<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - eSports Arena Manager</title>

    <link rel="stylesheet" href="../css/estilos.css">
</head>

<body>

    <header>
        <h1>eSports Arena Manager</h1>
        <p>Gestión de torneos competitivos</p>
    </header>

    <nav>
        <a href="../index.html">Inicio</a>
        <a href="torneos.html">Torneos</a>
        <a href="equipos.html">Equipos</a>
        <a href="inscripcion.html">Inscripción</a>
        <a href="partidas.html">Partidas</a>
        <a href="ranking.html">Ranking</a>
        <a href="registro.html">Registro</a>
    </nav>

    <main>

        <section>

            <h2>Crear cuenta</h2>

            <p>
                Regístrate para participar en los torneos de eSports Arena Manager.
            </p>

            <form id="form-registro">

                <div>
                    <label for="nombre">Nombre:</label>
                    <input
                        type="text"
                        id="nombre"
                        name="nombre"
                        autocomplete="name"
                        placeholder="Ej: Daniel"
                        required
                    >
                    <small id="error-nombre"></small>
                </div>

                <div>
                    <label for="nickname">Nickname:</label>
                    <input
                        type="text"
                        id="nickname"
                        name="nickname"
                        placeholder="Ej: ShadowPlayer"
                        required
                    >
                    <small id="error-nickname"></small>
                </div>

                <div>
                    <label for="email">Correo electrónico:</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        autocomplete="email"
                        placeholder="Ej: jugador@correo.com"
                        required
                    >
                    <small id="error-email"></small>
                </div>

                <div>
                    <label for="password">Contraseña:</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        autocomplete="new-password"
                        placeholder="Mínimo 8 caracteres"
                        required
                    >
                    <small id="error-password"></small>
                </div>

                <div>
                    <label for="confirmar-password">Confirmar contraseña:</label>
                    <input
                        type="password"
                        id="confirmar-password"
                        name="confirmar-password"
                        autocomplete="new-password"
                        placeholder="Repite tu contraseña"
                        required
                    >
                    <small id="error-confirmar"></small>
                </div>

                <button type="submit">Crear cuenta</button>

            </form>

        </section>

    </main>

    <footer>
        <p>Desarrollo FullStack II - eSports Arena Manager</p>
    </footer>
    <script src="../js/registro.js"></script>

</body>

</html>
